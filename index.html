<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snitch Shop</title>

<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --accent: #00a8ff;
    --accent2: #00d4ff;
    --text: #f0f0f5;
    --text2: #9090a8;
    --border: #2e2e40;
    --success: #22c55e;
    --radius: 14px;
    --cart-h: 70px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; overscroll-behavior: none; }
  body { overflow: hidden; display: flex; flex-direction: column; }

  /* SCREENS */
  .screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
  .screen.active { display: flex; }

  /* HEADER */
  .header { padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: none; color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .home-btn { height: 36px; padding: 0 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--text); color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; flex-shrink: 0; margin-left: auto; white-space: nowrap; }
  .home-btn:active { background: var(--surface2); color: var(--text); }
  .header-center { flex: 1; }
  .header-title { font-size: 17px; font-weight: 700; }
  .header-sub { font-size: 12px; color: var(--text2); }

  /* SCROLL AREA */
  .scroll { flex: 1; overflow-y: auto; padding: 14px 10px calc(var(--cart-h) + 20px); -webkit-overflow-scrolling: touch; }
  .scroll.no-cart-pad { padding-bottom: 80px; }

  /* CATEGORY GRID */
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; box-sizing: border-box; }
  .cat-card { background: var(--surface); border: 1px solid var(--text); border-radius: var(--radius); cursor: pointer; overflow: hidden; transition: transform .18s, border-color .18s; -webkit-tap-highlight-color: transparent; aspect-ratio: 1 / 1 !important; width: 100%; height: auto; display: flex; flex-direction: column; }
  .cat-card:active { transform: scale(.96); border-color: var(--accent); }
  .cat-card-emoji { font-size: 48px; padding-top: 12px; }
  .cat-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 28px 12px 12px; background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%); border-radius: 0 0 var(--radius) var(--radius); }
  .cat-name { font-weight: 700; }
  .cat-count-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }

  /* MODEL LIST */
  .model-list { display: flex; flex-direction: column; gap: 10px; }
  .model-card { background: var(--surface); border: 1px solid var(--text); border-radius: var(--radius); padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background .18s, border-color .18s; -webkit-tap-highlight-color: transparent; }
  .model-card:active { background: var(--surface2); border-color: var(--accent); }
  .model-thumb { width: 76px; height: 76px; border-radius: var(--radius); background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 28px; }
  .model-text { flex: 1; }
  .model-name { font-weight: 700; margin-bottom: 4px; }
  .model-sub { font-size: 13px; color: var(--text2); }

  /* FLAVOR LIST */
  .flavor-row { background: var(--surface); border: 1px solid var(--text); border-radius: var(--radius); padding: 12px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: border-color .15s; margin-bottom: 8px; }
  .flavor-row.selected { border-color: var(--accent2); }
  .flavor-row.unavailable { opacity: 0.5; color: var(--text2); pointer-events: none; }
  .flavor-row.unavailable .flavor-name { color: var(--text2); }
  .flavor-row.unavailable .qty-btn, .flavor-row.unavailable .qty-val { opacity: 0.3; cursor: not-allowed; }
  .flavor-left { flex: 1; }
  .flavor-name { font-weight: 600; }
  .flavor-stock { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .flavor-right { display: flex; align-items: center; gap: 8px; }
  .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface2); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
  .qty-btn:active { background: var(--accent); }
  .qty-val { min-width: 30px; text-align: center; font-weight: 700; }

  /* CART BAR */
  .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; height: var(--cart-h); background: var(--surface); border-top: 1px solid var(--border); display: none; align-items: center; padding: 0 16px; gap: 12px; z-index: 100; }
  .cart-bar.active { display: flex; }
  .cart-total { flex: 1; }
  .cart-total-label { font-size: 12px; color: var(--text2); }
  .cart-total-value { font-size: 20px; font-weight: 800; }
  .cart-open-btn { background: var(--accent); border: none; color: #fff; border-radius: 12px; padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .cart-badge { background: #fff; color: var(--accent); border-radius: 50%; width: 20px; height: 20px; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* CART SCREEN */
  .cart-item-row { background: var(--surface); border: 1px solid var(--text); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .cart-item-name { font-weight: 700; margin-bottom: 6px; }
  .cart-item-meta { font-size: 13px; color: var(--text2); display: flex; justify-content: space-between; align-items: center; }
  .cart-item-qty { display: flex; gap: 6px; align-items: center; }
  .cart-item-qty-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); border: none; color: var(--text); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .cart-item-qty-btn:active { background: var(--accent); }
  .cart-item-price { font-weight: 700; }

  /* MODAL */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200; }
  .modal.active { display: flex; }
  .modal-content { background: var(--surface); border-radius: 20px; padding: 24px; max-width: 90%; max-height: 80%; overflow-y: auto; text-align: center; }
  .modal-content > div:first-child { font-weight: 700; margin-bottom: 12px; font-size: 16px; }
  .modal-content > div:last-child { color: var(--text2); margin-bottom: 18px; line-height: 1.4; }
  .modal-btn { background: var(--accent); border: none; color: #fff; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; }

  /* BUTTONS */
  .btn { border: none; border-radius: var(--radius); padding: 14px 20px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform .15s; }
  .btn:active { transform: scale(.96); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); }
  .btn-block { width: 100%; margin-bottom: 10px; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
  .form-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-size: 15px; }
  .form-radio { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; margin-bottom: 10px; transition: border-color .15s; }
  .form-radio:active { border-color: var(--accent); }
  .form-radio input { cursor: pointer; }
</style>
</head>

  <div class="scroll" style="padding-bottom: 120px;">
    <div id="cart-list"></div>

  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 16px; display: flex; gap: 10px;">
    <button class="btn btn-secondary" onclick="goBack()" data-i18n="continue">Продолжить</button>
    <button class="btn btn-primary" onclick="goTo('s-order')" data-i18n="checkout">Оформить</button>

<!-- ORDER FORM -->
<div class="screen" id="s-order">

<!-- SUCCESS -->
<div class="screen" id="s-success">

    <div class="header-center"><div class="header-title" data-i18n="order_done">Заказ оформлен!</div></div>
  </div>

    <div style="font-weight: 700; font-size: 18px; margin-bottom: 8px;" data-i18n="success_title">Спасибо за заказ!</div>
    <div style="color: var(--text2); margin-bottom: 24px;" id="success-sub"></div>
    <a id="manager-link" class="btn btn-primary" target="_blank" data-i18n="success_contact">Написать менеджеру</a>
    <button class="btn btn-secondary" style="margin-top: 10px;" onclick="newOrder()" data-i18n="new_order">Новый заказ</button>
  </div>
</div>

<!-- HISTORY -->
<div class="screen" id="s-history">

  </div>
  <div class="scroll" id="history-list"></div>
</div>

<!-- INFO PAGES -->
<div class="screen" id="s-info">

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">

    <div id="modal-title"></div>
    <div id="modal-text"></div>

let lang = 'ru';

// TRANSLATIONS
const i18n = {
  ru: {

function tr(key, ...args) {
  let val = i18n[lang][key];
  if (typeof val === 'function') return val(...args);
  return val || key;
}

function setLang(l) { lang = l; }

// ============================================================
// UI FUNCTIONS
// ============================================================

function goTo(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  screenStack.push(screenId);
  if (screenId === 's-cats') renderCategories();
  if (screenId === 's-models') renderModels(currentModel);
  if (screenId === 's-flavors') renderFlavors();
  if (screenId === 's-cart') renderCart();
  if (screenId === 's-order') renderOrderForm();
  updateCartBar();
}

function goBack() {
  screenStack.pop();
  const prev = screenStack[screenStack.length - 1] || 's-cats';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(prev).classList.add('active');
  updateCartBar();
}

function showModal(title, text = '') {
  if (typeof title === 'string' && !text) {
    text = title;
    title = '';
  }
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').textContent = text;
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function updateCartBar() {
  const count = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
  const total = Object.values(cart).reduce((sum, item) => sum + item.qty * item.price, 0);
  
  if (count > 0) {
    document.querySelectorAll('.cart-bar').forEach(bar => bar.classList.add('active'));
    document.getElementById('cart-total').textContent = total + ' zł';
    document.getElementById('cart-total2').textContent = total + ' zł';
    document.getElementById('cart-total3').textContent = total + ' zł';
    document.getElementById('cart-count').textContent = count;
    document.getElementById('cart-count2').textContent = count;
    document.getElementById('cart-count3').textContent = count;
  } else {
    document.querySelectorAll('.cart-bar').forEach(bar => bar.classList.remove('active'));
  }
}

function cartCount() {
  return Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
}

function cartTotal() {
  return Object.values(cart).reduce((sum, item) => sum + item.qty * item.price, 0);
}

// ============================================================
// RENDER FUNCTIONS
// ============================================================

function renderCategories() {
  document.getElementById('cat-grid').innerHTML = CATALOG.map(cat => `
    <div class="cat-card" onclick="currentModel='${cat.id}'; goTo('s-models')">
      <div class="cat-card-emoji">${cat.icon}</div>
      <div class="cat-overlay">
        <div class="cat-name">${cat.name}</div>
      </div>
    </div>
  `).join('');
}

function renderModels(catId) {
  const cat = CATALOG.find(c => c.id === catId);
  document.getElementById('model-header-title').textContent = cat.name;
  document.getElementById('model-list').innerHTML = cat.models.map(model => `
    <div class="model-card" onclick="renderFlavorsList('${model.id}', '${model.name}', ${model.price})">
      <div class="model-thumb">${model.icon || '📦'}</div>
      <div class="model-text">
        <div class="model-name">${model.name}</div>
        <div class="model-sub">${model.price} zł</div>
      </div>
    </div>
  `).join('');
}

function renderFlavorsList(modelId, modelName, price) {
  currentModel = modelId;
  document.getElementById('flavor-header-title').textContent = modelName;
  document.getElementById('flavor-header-sub').textContent = price + ' zł';
  goTo('s-flavors');
}

function renderFlavors() {
  const model = CATALOG.flatMap(c => c.models).find(m => m.id === currentModel);
  if (!model) return;

  document.getElementById('flavor-list').innerHTML = model.flavors.map(flavor => {
    const key = `${currentModel}::${flavor}`;
    const stock = MAX_STOCK[key] || 0;
    const cartItem = cart[key] || {};
    const isUnavailable = stock <= 0;

    return `
      <div class="flavor-row ${cartItem.qty ? 'selected' : ''} ${isUnavailable ? 'unavailable' : ''}">
        <div class="flavor-left">
          <div class="flavor-name">${flavor}</div>
          <div class="flavor-stock">Есть: ${stock} шт</div>
        </div>
        <div class="flavor-right">
          ${!isUnavailable ? `
            <button class="qty-btn" onclick="changeQty('${key}', ${model.id}, '${flavor}', ${model.price}, -1)">−</button>
            <div class="qty-val">${cartItem.qty || 0}</div>
            <button class="qty-btn" onclick="changeQty('${key}', '${currentModel}', '${flavor}', ${model.price}, 1)">+</button>
          ` : '<span style="color: var(--text2); font-size: 12px;">Нет в наличии</span>'}
        </div>
      </div>
    `;
  }).join('');
}

function changeQty(key, modelId, flavor, price, delta) {
  const stock = MAX_STOCK[key] || 0;
  const current = cart[key]?.qty || 0;
  const newQty = Math.max(0, current + delta);

  if (newQty > stock) {
    showModal('Недостаточно запасов', `Доступно только ${stock} шт`);
    return;
  }

  if (newQty === 0) {
    delete cart[key];
  } else {
    cart[key] = { model: modelId, flavor, qty: newQty, price };
  }

  renderFlavors();
  updateCartBar();
}

function renderCart() {
  const items = Object.entries(cart);
  if (items.length === 0) {
    document.getElementById('cart-list').innerHTML = '<div style="text-align: center; color: var(--text2); padding: 40px;">Корзина пуста</div>';
    return;
  }

  document.getElementById('cart-list').innerHTML = items.map(([key, item]) => `
    <div class="cart-item-row">
      <div class="cart-item-name">${item.model} - ${item.flavor}</div>
      <div class="cart-item-meta">
        <div class="cart-item-qty">
          <button class="cart-item-qty-btn" onclick="changeQty('${key}', '${item.model}', '${item.flavor}', ${item.price}, -1)">−</button>
          <span>${item.qty}</span>
          <button class="cart-item-qty-btn" onclick="changeQty('${key}', '${item.model}', '${item.flavor}', ${item.price}, 1)">+</button>
        </div>
        <div class="cart-item-price">${item.qty * item.price} zł</div>
      </div>
    </div>
  `).join('');
}

function getDeliveryCost() {
  return orderDelivery === 'paczkomat' ? 5 : 10;
}

function renderOrderForm() {
  const total = cartTotal();
  const delivery = getDeliveryCost();

  document.getElementById('order-form').innerHTML = `
    <div class="form-group">
      <label class="form-label">Способ оплаты</label>
      <label class="form-radio">
        <input type="radio" name="payment" value="crypto" onchange="orderPayment='crypto'">
        <span>💳 Крипто</span>
      </label>
      <label class="form-radio">
        <input type="radio" name="payment" value="cod" onchange="orderPayment='cod'" checked>
        <span>💵 При получении</span>
      </label>
    </div>

    <div class="form-group">
      <label class="form-label">Способ доставки</label>
      <label class="form-radio">
        <input type="radio" name="delivery" value="paczkomat" onchange="orderDelivery='paczkomat'">
        <span>📦 Paczkomat (5 zł)</span>
      </label>
      <label class="form-radio">
        <input type="radio" name="delivery" value="kurier" onchange="orderDelivery='kurier'" checked>
        <span>🚚 Куриер (10 zł)</span>
      </label>
    </div>

    <div class="form-group" id="delivery-fields"></div>

    <div style="background: var(--surface2); padding: 12px; border-radius: var(--radius); margin-bottom: 16px;">
      <div style="font-size: 12px; color: var(--text2); margin-bottom: 4px;">Сумма товаров:</div>
      <div style="font-weight: 700; margin-bottom: 8px;">${total} zł</div>
      <div style="font-size: 12px; color: var(--text2); margin-bottom: 4px;">Доставка:</div>
      <div style="font-weight: 700; margin-bottom: 8px;" id="delivery-cost">${delivery} zł</div>
      <div style="border-top: 1px solid var(--border); padding-top: 8px; font-size: 14px; font-weight: 700;">
        ИТОГО: ${total + delivery} zł
      </div>
    </div>

    <button class="btn btn-primary btn-block" onclick="submitOrder()">Оформить заказ</button>
  `;

  renderDeliveryFields();
  updateDeliveryCost();
}

function renderDeliveryFields() {
  const fields = document.getElementById('delivery-fields');
  fields.innerHTML = `
    <label class="form-label">Имя и Фамилия *</label>
    <input type="text" class="form-input" id="f-name" placeholder="John Doe">
    <label class="form-label">Телефон *</label>
    <input type="tel" class="form-input" id="f-phone" placeholder="+48 (543) 543-543">
    <label class="form-label">Город *</label>
    <input type="text" class="form-input" id="f-miasto" placeholder="Warszawa">
  `;

  if (orderDelivery === 'paczkomat') {
    fields.innerHTML += `
      <label class="form-label">Код пачкомата (буквы и цифры) *</label>
      <input type="text" class="form-input" id="f-kodpacz" placeholder="WA123">
    `;
  } else {
    fields.innerHTML += `
      <label class="form-label">Индекс *</label>
      <input type="text" class="form-input" id="f-kod" placeholder="00-001">
      <label class="form-label">Улица *</label>
      <input type="text" class="form-input" id="f-ulica" placeholder="Pulaskiego">
      <label class="form-label">Дом *</label>
      <input type="text" class="form-input" id="f-budynek" placeholder="123">
      <label class="form-label">Квартира</label>
      <input type="text" class="form-input" id="f-lokal" placeholder="45">
    `;
  }
}

function updateDeliveryCost() {
  const cost = getDeliveryCost();
  document.getElementById('delivery-cost').textContent = cost + ' zł';
}

function submitOrder() {
  const name = (document.getElementById('f-name')?.value || '').trim();
  const phone = (document.getElementById('f-phone')?.value || '').trim();
  const miasto = (document.getElementById('f-miasto')?.value || '').trim();

  if (!name || !phone || !miasto) {
    showModal('Заполните все поля');
    return;
  }

  const total = cartTotal();
  const delivery = getDeliveryCost();
  const count = cartCount();
  const orderLines = Object.entries(cart).map(([k, item]) => `${item.model} (${item.flavor}) x${item.qty}`).join('\n');

  let msg = `Привет! У меня есть заказ:\n\n`;
  msg += orderLines + '\n\n';
  msg += `Товаров: ${count}\n`;
  msg += `Сумма: ${total} zł\n\n`;
  msg += `Имя: ${name}\n`;
  msg += `Телефон: ${phone}\n`;
  msg += `Город: ${miasto}\n`;

  if (orderDelivery === 'paczkomat') {
    const kod = (document.getElementById('f-kodpacz')?.value || '').trim();
    if (!kod) { showModal('Введите код пачкомата'); return; }
    msg += `Доставка: Paczkomat\nКод: ${kod}\n`;
  } else {
    const kod = (document.getElementById('f-kod')?.value || '').trim();
    const ulica = (document.getElementById('f-ulica')?.value || '').trim();
    const budynek = (document.getElementById('f-budynek')?.value || '').trim();
    const lokal = (document.getElementById('f-lokal')?.value || '').trim();
    if (!kod || !ulica || !budynek) { showModal('Заполните все поля адреса'); return; }
    msg += `Доставка: Kurier\nПочтовый индекс: ${kod}\nУлица: ${ulica} ${budynek}${lokal ? ' / ' + lokal : ''}\n`;
  }

  msg += `\nДоставка: ${delivery} zł\nИТОГО: ${total + delivery} zł`;

  const encoded = encodeURIComponent(msg);
  document.getElementById('manager-link').href = `https://t.me/${MANAGER_USERNAME}?text=${encoded}`;
  document.getElementById('success-sub').textContent = `Менеджер свяжется с вами для подтверждения`;
  
  cart = {};
  updateCartBar();
  goTo('s-success');
}

function saveOrderToHistory(paymentMethod) {
  const storage = window.Telegram?.WebApp?.CloudStorage;
  const order = {
    id: Date.now(),
    items: Object.values(cart),
    total: cartTotal(),
    delivery: getDeliveryCost(),
    payment: paymentMethod,
    date: new Date().toLocaleString()
  };
  
  if (storage) {
    storage.getItem('orders', (err, val) => {
      const orders = val ? JSON.parse(val) : [];
      orders.unshift(order);
      storage.setItem('orders', JSON.stringify(orders.slice(0, 20)), (err) => {});
    });
  } else {
    try {
      const orders = JSON.parse(localStorage.getItem('vl_orders') || '[]');
      orders.unshift(order);
      localStorage.setItem('vl_orders', JSON.stringify(orders.slice(0, 20)));
    } catch(e) {}
  }
}

function renderHistory(orders = []) {
  if (orders.length === 0) {
    document.getElementById('history-list').innerHTML = '<div style="text-align: center; color: var(--text2); padding: 40px;">История пуста</div>';
    return;
  }
  
  document.getElementById('history-list').innerHTML = orders.map(order => {
    const payIcon = order.payment === 'crypto' ? '💳' : '💵';
    const payLabel = order.payment === 'crypto' ? 'Крипто' : 'При получении';
    return `
      <div class="cart-item-row">
        <div style="font-weight: 700; margin-bottom: 6px;">${order.date}</div>
        <div style="font-size: 13px; color: var(--text2); margin-bottom: 4px;">Товаров: ${order.items.length}</div>
        <div style="display: flex; justify-content: space-between;">
          <span>${payIcon} ${payLabel}</span>
          <span style="font-weight: 700;">${order.total + order.delivery} zł</span>
        </div>
      </div>
    `;
  }).join('');
}

function openHistory() {
  const storage = window.Telegram?.WebApp?.CloudStorage;
  if (storage) {
    storage.getItem('orders', (err, val) => {
      renderHistory(val ? JSON.parse(val) : []);
    });
  } else {
    try {
      const orders = JSON.parse(localStorage.getItem('vl_orders') || '[]');
      renderHistory(orders);
    } catch(e) { renderHistory([]); }
  }
}

function goToPage(page) {
  if (page === 'delivery') {
    document.getElementById('info-title').textContent = tr('info_delivery_title');
    let content = tr('info_delivery_title') + '\n\n';
    content += tr('info_delivery_cod') + '\n';
    content += tr('info_delivery_paczkomat');
  } else if (page === 'payment') {
    document.getElementById('info-title').textContent = tr('info_payment_title');
    let content = tr('info_payment_title') + '\n\n';
    content += tr('info_payment_crypto');
  } else if (page === 'returns') {
    document.getElementById('info-title').textContent = tr('info_returns_title');
    let content = tr('info_returns_title') + '\n\n';
    content += tr('info_returns_step1') + '\n';
    content += tr('info_returns_step2');
  }
  
  goTo('s-info');
}

function newOrder() {
  cart = {};
  screenStack = [];
  goTo('s-cats');
}

// ============================================================
// INIT
// ============================================================

goTo('s-lang');
</script>
