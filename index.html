<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stitch Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --accent: #00a8ff;
    --accent2: #00d4ff;
    --text: #f0f0f5;
    --text2: #9090a8;
    --border: #2e2e40;
    --success: #22c55e;
    --radius: 14px;
    --cart-h: 70px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; overscroll-behavior: none; }
  body { overflow: hidden; display: flex; flex-direction: column; }

  /* SCREENS */
  .screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
  .screen.active { display: flex; }

  /* HEADER */
  .header { padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: none; color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .home-btn { height: 36px; padding: 0 12px; border-radius: 18px; background: var(--surface); border: none; color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; flex-shrink: 0; margin-left: auto; white-space: nowrap; }
  .home-btn:active { background: var(--surface2); color: var(--text); }
  .header-center { flex: 1; }
  .header-title { font-size: 17px; font-weight: 700; }
  .header-sub { font-size: 12px; color: var(--text2); }

  /* SCROLL AREA */
  .scroll { flex: 1; overflow-y: auto; padding: 14px 14px calc(var(--cart-h) + 20px); -webkit-overflow-scrolling: touch; }
  .scroll.no-cart-pad { padding-bottom: 20px; }

  /* CATEGORY GRID */
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; overflow: hidden; transition: transform .18s, border-color .18s; -webkit-tap-highlight-color: transparent; }
  .cat-card:active { transform: scale(.96); border-color: var(--accent); }
  .cat-img { width: 100%; aspect-ratio: 4/3; background: var(--surface2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cat-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cat-img-icon { font-size: 42px; }
  .cat-card-body { display: none; }
  .cat-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 28px 12px 12px; background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%); border-radius: 0 0 var(--radius) var(--radius); }
  .cat-img { position: relative; }
  /* SELECT OPTIONS & RADIO BUTTONS */
  .select-option, input[type="radio"] + label {
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--surface2);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: block;
    margin-bottom: 10px;
  }
  .select-option:hover, input[type="radio"]:checked + label {
    border-color: var(--accent);
    background: rgba(0, 168, 255, 0.08);
    color: var(--accent);
  }
  
  .cat-name { font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  .cat-count-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }

  /* MODEL LIST */
  .model-list { display: flex; flex-direction: column; gap: 10px; }
  /* SECTION TITLES */
  .form-section-title { 
    font-size: 16px !important;
    font-weight: 700 !important;
    color: var(--text) !important;
    margin: 20px 0 14px 0 !important;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  /* SPACING & HIERARCHY */
  .form-group { margin-bottom: 20px; }
  .cart-summary-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cart-summary-row:last-child { border-bottom: none; }
  
  /* ORDER ITEMS */
  .order-model-name { 
    font-size: 15px !important;
    font-weight: 700 !important;
    color: var(--text) !important;
  }
  .order-model-meta { 
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
  }
  
  .model-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background .18s, border-color .18s; -webkit-tap-highlight-color: transparent; }
  .model-card:active { background: var(--surface2); border-color: var(--accent); }
  .model-thumb { width: 76px; height: 76px; border-radius: 10px; background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 28px; }
  .model-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .model-info { flex: 1; min-width: 0; }
  .model-name { font-size: 15px; font-weight: 700; }
  .model-count { font-size: 12px; color: var(--text2); margin-top: 3px; }
  .arrow { color: var(--accent2); font-size: 18px; }

  /* FLAVOUR LIST */
  .flavor-list { display: flex; flex-direction: column; gap: 8px; }
  .flavor-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: border-color .15s; }
  .flavor-row.selected { border-color: var(--accent2); }
  .flavor-name { font-size: 14px; flex: 1; }
  .qty-ctrl { display: flex; align-items: center; gap: 0; }
  .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface2); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
  .qty-btn:active { background: var(--accent); }
  .qty-val { width: 32px; text-align: center; font-size: 15px; font-weight: 700; }

  /* TEXT & TYPOGRAPHY IMPROVEMENTS */
  h1, .header-title { font-size: 24px !important; font-weight: 800 !important; letter-spacing: -0.5px; }
  h2, .header-sub { font-size: 16px !important; font-weight: 700; color: var(--text2); margin: 12px 0 8px; }
  p, .text { font-size: 14px; line-height: 1.6; }
  
  /* FORM INPUTS */
  input[type="text"], input[type="tel"], textarea { 
    background: var(--surface2) !important; 
    border: 2px solid var(--border) !important; 
    border-radius: 12px !important;
    padding: 14px 16px !important;
    color: var(--text) !important;
    font-size: 15px !important;
    transition: all 0.2s ease;
  }
  input[type="text"]:focus, input[type="tel"]:focus, textarea:focus { 
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 3px rgba(0, 168, 255, 0.1) !important;
    outline: none;
  }
  input::placeholder { color: var(--text2) !important; font-size: 14px; }
  
  /* BUTTONS */
  .btn-primary, .btn-secondary, button { 
    border-radius: 12px !important;
    font-weight: 700;
    font-size: 15px;
    padding: 16px 20px !important;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  .btn-primary:active, button:active { 
    transform: scale(0.98);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  }
  
  /* LABELS & HINTS */
  label { 
    font-weight: 600 !important;
    font-size: 14px !important;
    color: var(--text) !important;
    display: block;
    margin-bottom: 8px;
  }
  .hint { font-size: 12px; color: var(--text2); margin-top: 6px; line-height: 1.4; }
  
  /* CART BAR */  /* CART BAR */
  .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; height: var(--cart-h); background: var(--surface); border-top: 1px solid var(--border); display: none; align-items: center; padding: 0 16px; gap: 12px; z-index: 100; }
  .cart-bar.visible { display: flex; }
  .cart-info { flex: 1; }
  .cart-items-count { font-size: 13px; color: var(--text2); }
  .cart-total { font-size: 17px; font-weight: 700; }
  .cart-open-btn { background: var(--accent); border: none; color: #fff; border-radius: 12px; padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .cart-badge { background: #fff; color: var(--accent); border-radius: 50%; width: 20px; height: 20px; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* CART SCREEN */
  .cart-empty { text-align: center; padding: 60px 20px; color: var(--text2); }
  .cart-empty-icon { font-size: 50px; margin-bottom: 12px; }
  .cart-item-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .cart-item-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
  .cart-item-name { font-size: 14px; font-weight: 700; flex: 1; }
  .cart-item-cat { font-size: 12px; color: var(--accent2); margin-top: 2px; }
  .cart-item-del { background: none; border: none; color: #ef4444; font-size: 20px; cursor: pointer; padding: 0 0 0 8px; }
  .cart-item-row .qty-ctrl { justify-content: flex-start; }
  .cart-summary { background: var(--surface2); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
  .cart-summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: var(--text2); }
  .cart-summary-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .btn-primary { width: 100%; background: var(--accent); border: none; color: #fff; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 14px; transition: opacity .15s; }
  .btn-primary:active { opacity: .85; }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  /* ORDER FORM */
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
  input, textarea, select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; outline: none; transition: border-color .15s; font-family: inherit; }
  input:focus, textarea:focus { border-color: var(--accent2); }
  textarea { resize: none; height: 70px; }
  .order-summary { background: var(--surface2); border-radius: var(--radius); padding: 14px; margin-bottom: 18px; }
  .order-summary-title { font-size: 13px; color: var(--text2); margin-bottom: 10px; }
  .order-model-group { margin-bottom: 12px; }
  .order-model-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .order-model-name { font-size: 14px; font-weight: 700; }
  .order-model-meta { font-size: 13px; color: var(--accent2); font-weight: 600; white-space: nowrap; margin-left: 8px; }
  .order-flavor-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); padding: 2px 0 2px 10px; }
  .order-summary-total { font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

  /* SELECTOR BUTTONS (payment / delivery) */
  .selector-group { display: flex; gap: 10px; margin-bottom: 20px; }
  .selector-btn { flex: 1; padding: 14px 10px; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--surface); color: var(--text2); font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; transition: all .18s; line-height: 1.4; }
  .selector-btn .sel-icon { font-size: 22px; display: block; margin-bottom: 5px; }
  .selector-btn.selected { border-color: var(--accent2); background: var(--surface2); color: var(--text); }
  .selector-btn:active { background: var(--surface2); }
  .form-section-title { font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 12px; }
  .hint { font-size: 12px; color: var(--text2); margin-top: 5px; }

  /* SUCCESS */
  .success-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; height: 100%; }
  .success-icon { font-size: 64px; margin-bottom: 20px; }
  .success-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .success-sub { color: var(--text2); font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
  .btn-manager { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #229ED9; border: none; color: #fff; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; margin-bottom: 12px; }
  .btn-secondary { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }

  .cart-total-label { font-size: 15px; font-weight: 800; color: var(--text); }
  .cart-upsell { font-size: 11px; color: #22c55e; line-height: 1.4; display: none; }

  /* UPSELL BANNER */
  .upsell-banner { background: linear-gradient(135deg,#1a2a1a,#0f2010); border: 1px solid #22c55e44; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; display: none; color: #22c55e; line-height: 1.5; }
  .upsell-banner b { color: #4ade80; }

  /* SMART PRICE BADGE */
  .smart-badge { background: linear-gradient(135deg,#7c3aed,#a855f7); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; display: none; }
  .smart-badge b { color: #fff; }
  .smart-tiers { background: var(--surface2); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
  .smart-tiers-title { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing:.05em; margin-bottom: 8px; }
  .smart-tier-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--text2); }
  .smart-tier-row:last-child { border-bottom: none; }
  .smart-tier-row.active { color: var(--text); font-weight: 700; }
  .smart-tier-row.active .tier-price { color: #a855f7; }
  .section-title { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; margin-top: 18px; }
  .section-title:first-child { margin-top: 0; }

  /* TOGGLE TABS */
  .tab-bar { display: flex; gap: 8px; padding: 12px 14px 0; flex-shrink: 0; }
  /* IMPROVED TABS */
  .tab-btn {
    border-radius: 12px !important;
    padding: 12px 16px !important;
    font-weight: 700 !important;
    font-size: 15px !important;
    transition: all 0.2s ease;
    border: 2px solid transparent !important;
  }
  .tab-btn.active { 
    background: var(--accent) !important;
    color: #fff !important;
    border-color: var(--accent) !important;
  }
  .tab-btn:not(.active) {
    background: var(--surface2) !important;
    border-color: var(--border) !important;
  }
  
  .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text2); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* HISTORY */
  .history-empty { text-align:center; padding:60px 20px; color:var(--text2); }
  .history-empty-icon { font-size:48px; margin-bottom:12px; }
  .history-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
  .history-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .history-order-num { font-size:13px; font-weight:700; color:var(--accent2); }
  .history-date { font-size:12px; color:var(--text2); }
  .history-items { font-size:13px; color:var(--text2); margin-bottom:8px; line-height:1.6; }
  .history-footer { display:flex; justify-content:space-between; align-items:center; padding-top:8px; border-top:1px solid var(--border); }
  .history-payment { font-size:12px; color:var(--text2); }
  .history-total { font-size:15px; font-weight:800; }

  /* LANGUAGE MODAL */
  .lang-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .lang-overlay.hidden { display: none; }
  .lang-blur { position: fixed; inset: 0; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: rgba(10,8,20,0.55); }
  .lang-card { position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 36px 28px 32px; width: 100%; max-width: 320px; text-align: center; }
  .lang-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px; }
  .lang-heading { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 28px; }
  .lang-btns { display: flex; gap: 12px; }
  .lang-btn { flex: 1; padding: 22px 10px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 28px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .18s, background .18s; -webkit-tap-highlight-color: transparent; letter-spacing: 1px; }
  .lang-btn:active { background: var(--accent); border-color: var(--accent); }

  /* SPLASH SCREEN */
  .splash-overlay { position: fixed; inset: 0; z-index: 9999; background: linear-gradient(135deg, #0f0f13 0%, #1a1a24 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; animation: fadeOut 0.6s ease-out 1.8s forwards; }
  .splash-overlay.hidden { display: none; }
  @keyframes fadeInScale { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
  .splash-progress { width: 160px; height: 4px; background: rgba(0,168,255,0.2); border-radius: 2px; overflow: hidden; }
  .splash-progress-bar { height: 100%; background: linear-gradient(90deg, #00a8ff, #00d4ff); border-radius: 2px; animation: progress 2s ease-in-out forwards; }
  @keyframes progress { from { width: 0%; } to { width: 100%; } }
  @keyframes fadeOut { to { opacity: 0; pointer-events: none; } }

</style>
</head>
<body>

<!-- SCREEN 7: HISTORY -->
<div class="screen" id="s-history">
  <div class="header">
    <button class="back-btn" onclick="goTo('s-cats')">←</button>
    <div class="header-center">
      <div class="header-title" data-i18n="history_title">🕐 Мои заказы</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="home-btn" onclick="goTo('s-cats')" data-i18n="home">🏠 На главную</button>
      <button class="lang-switch-sub" onclick="toggleLang()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent">RU</button>
    </div>
  </div>
  <div class="scroll no-cart-pad" id="history-content"></div>
</div>

<!-- SCREEN 1: CATEGORIES -->
<div class="screen active" id="s-cats">
  <div class="header">
    <div class="header-center">
      <div class="header-title">👽 Stitch Shop</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
      <button class="home-btn" data-i18n="orders" onclick="openHistory()">🕐 Заказы</button>
      <button id="lang-switch-btn" onclick="toggleLang()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s">RU</button>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-cats" onclick="switchTab('cats')" data-i18n="tab_cats">🗂 Категории</button>
    <button class="tab-btn" id="tab-all" onclick="switchTab('all')" data-i18n="tab_all">📦 Все товары</button>
  </div>
  <div class="scroll no-cart-pad" id="main-scroll">
    <div class="cat-grid" id="cat-grid"></div>
    <div id="all-models-list" style="display:none;flex-direction:column;gap:10px;"></div>
  </div>
</div>

<!-- SCREEN 2: MODELS -->
<div class="screen" id="s-models">
  <div class="header">
    <button class="back-btn" onclick="goTo('s-cats')">←</button>
    <div class="header-center">
      <div class="header-title" id="models-title"></div>
      <div class="header-sub" data-i18n="choose_model">Выберите модель</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="home-btn" onclick="goTo('s-cats')" data-i18n="home">🏠 На главную</button>
      <button class="lang-switch-sub" onclick="toggleLang()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent">RU</button>
    </div>
  </div>
  <div class="scroll">
    <div class="model-list" id="model-list"></div>
  </div>
</div>

<!-- SCREEN 3: FLAVOURS -->

// ============================================================
// SMART PRICING
// ============================================================
// Тиры: [минимальное кол-во, цена за шт. в zł]
const PRICING = {
  disposable: { tiers: [[1,70],[3,65],[5,60],[10,55],[20,48],[50,45],[100,40]], base: 70 },
  pods:        { tiers: [[1,80]], base: 80 },
  cartridges:  { tiers: [[1,55]], base: 55 },
  liquids:     { tiers: [[1,50],[3,45],[5,40],[10,35],[20,32],[50,26],[100,24]], base: 50 }
};

function getSmartPrice(catId, totalQty) {
  const p = PRICING[catId];
  if (!p) return 0;
  let price = p.tiers[0][1];
  for (const [minQty, unitPrice] of p.tiers) {
    if (totalQty >= minQty) price = unitPrice;
  }
  return price;
}

function getBasePrice(catId) {
  return PRICING[catId]?.base || 0;
}

// Сумма штук в категории
function catQty(catId) {
  return Object.values(cart)
    .filter(i => i.catId === catId)
    .reduce((s, i) => s + i.qty, 0);
}

// Итого по всей корзине с учётом смарт-цен
function cartTotal() {
  let total = 0;
  for (const catId of Object.keys(PRICING)) {
    const qty = catQty(catId);
    if (qty === 0) continue;
    total += qty * getSmartPrice(catId, qty);
  }
  return total;
}

// Сколько сэкономил клиент (vs базовая цена 1-2 шт.)
function cartSavings() {
  let saved = 0;
  for (const catId of Object.keys(PRICING)) {
    const qty = catQty(catId);
    if (qty === 0) continue;
    const base = getBasePrice(catId);
    const smart = getSmartPrice(catId, qty);
    saved += qty * (base - smart);
  }
  return saved;
}

function formatPrice(p) { return p.toLocaleString('pl-PL') + ' zł'; }

  const bar = document.getElementById('cart-bar');
  const hide = ['s-cart','s-order','s-success'].includes(screenId);

  if (!hide && count > 0) {

    document.getElementById('cart-items-label').textContent = `${count} ${tr('pos_in_cart')}`;
    document.getElementById('cart-total-label').textContent = formatPrice(total);
    document.getElementById('cart-badge').textContent = count;

// ============================================================
function renderFlavors() {
  const list = document.getElementById('flavor-list');
  const tiers = PRICING[currentCat.id]?.tiers || [];
  const hasTiers = tiers.length > 1;
  const qtyInCat = catQty(currentCat.id);
  const curPrice = getSmartPrice(currentCat.id, qtyInCat);

  // Smart tiers table
  let tiersHtml = '';
  if (hasTiers) {
    const rows = tiers.map((t, i) => {
      const [minQty, price] = t;
      const nextMin = tiers[i+1]?.[0];
      const label = nextMin ? `${minQty}–${nextMin-1} ${tr('pcs')}` : `${minQty}+ ${tr('pcs')}`;
      const isActive = qtyInCat >= minQty && (!nextMin || qtyInCat < nextMin);
      return `<div class="smart-tier-row${isActive?' active':''}">
        <span>${label}</span>
        <span class="tier-price">${price} ${tr('per_pcs')}</span>
      </div>`;
    }).join('');
    tiersHtml = `<div class="smart-tiers">
      <div class="smart-tiers-title">${tr('smart_cena_title')}</div>
      ${rows}
    </div>`;
  } else {
    tiersHtml = `<div class="smart-tiers">
      <div class="smart-tiers-title">${tr('price_title')}</div>
      <div class="smart-tier-row active"><span>${tr('per_piece')}</span><span class="tier-price">${curPrice} zł</span></div>
    </div>`;
  }

  list.innerHTML = tiersHtml + currentModel.flavors.map(flavor => {
    const key = `${currentModel.id}::${flavor}`;
    const qty = cart[key]?.qty || 0;
    return `
      <div class="flavor-row ${qty > 0 ? 'selected' : ''}" id="row-${safeId(key)}">
        <div class="flavor-name">${flavor}</div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${escQ(key)}', -1)">−</button>
          <div class="qty-val" id="qty-${safeId(key)}">${qty}</div>
          <button class="qty-btn" onclick="changeQty('${escQ(key)}', 1)">+</button>
        </div>
      </div>`;
  }).join('');

  updateFlavorSmartBadge();
}

function safeId(key) { return key.replace(/[^a-zA-Z0-9]/g, '_'); }
function escQ(key) { return key.replace(/'/g, "\\'"); }

function changeQty(key, delta) {
  const flavor = key.split('::')[1];
  const current = cart[key]?.qty || 0;
  const newQty = Math.max(0, current + delta);

  if (newQty === 0) {
    delete cart[key];
  } else {
    cart[key] = {
      key,
      flavor,
      model: currentModel.name,
      category: currentCat.name,
      catId: currentCat.id,
      qty: newQty
    };
  }

  const sid = safeId(key);
  const qEl = document.getElementById('qty-' + sid);
  const rEl = document.getElementById('row-' + sid);
  if (qEl) qEl.textContent = newQty;
  if (rEl) rEl.classList.toggle('selected', newQty > 0);

  // Update smart price hint on flavor screen
  updateFlavorSmartBadge();
  updateCartBar('s-flavors');
}

function updateFlavorSmartBadge() {
  if (!currentCat) return;

  const qty = catQty(currentCat.id);
  const price = getSmartPrice(currentCat.id, qty);
  const tiers = PRICING[currentCat.id]?.tiers || [];
  const hasTiers = tiers.length > 1;

  // Upsell in cart bar
  const cartUpsell = document.getElementById('cart-upsell');
  if (!cartUpsell || !hasTiers || qty === 0) {
    if (cartUpsell) { cartUpsell.style.display = 'none'; cartUpsell.textContent = ''; }
    return;
  }
  const nextTier = tiers.find(([minQty]) => minQty > qty);
  if (!nextTier) { cartUpsell.style.display = 'none'; cartUpsell.textContent = ''; return; }

  const [nextMin, nextPrice] = nextTier;
  const need = nextMin - qty;
  const savingsPerUnit = price - nextPrice;
  const totalSavings = nextMin * savingsPerUnit;

  if (need <= 5) {
    cartUpsell.style.display = 'block';
    cartUpsell.innerHTML = tr('upsell', need, nextPrice, totalSavings);
  } else {
    cartUpsell.style.display = 'none';
    cartUpsell.textContent = '';
  }
}

function cartCount() { return Object.values(cart).reduce((s, i) => s + i.qty, 0); }

document.getElementById('cart-open-btn').onclick = () => {

document.getElementById('cart-back-btn').onclick = () => goTo(previousScreen);

function renderCart() {
  const content = document.getElementById('cart-content');
  const items = Object.values(cart);

  if (items.length === 0) {
    content.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty-icon">🛒</div>
        <div>${tr('cart_empty')}</div>
        <div style="margin-top:8px;font-size:13px;color:var(--text2)">${tr('cart_empty_sub')}</div>
      </div>`;
    return;
  }

  // Group by catId
  const grouped = {};
  items.forEach(item => {
    if (!grouped[item.catId]) grouped[item.catId] = [];
    grouped[item.catId].push(item);
  });

  let html = '';
  Object.entries(grouped).forEach(([catId, catItems]) => {
    const cat = catalog.find(c => c.id === catId);
    const qtyInCat = catQty(catId);
    const unitPrice = getSmartPrice(catId, qtyInCat);

    html += `<div class="section-title">${cat?.icon || ''} ${lang === 'pl' && cat?.name_pl ? cat.name_pl : (cat?.name || catId)}</div>`;

    catItems.sort((a, b) => a.model.localeCompare(b.model));
    catItems.forEach(item => {
      html += `
        <div class="cart-item-row" id="citem-${safeId(item.key)}">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="flex:1;min-width:0">
              <div class="cart-item-name" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.model} — ${item.flavor}</div>
            </div>
            <div class="qty-ctrl" style="flex-shrink:0">
              <button class="qty-btn" onclick="cartChangeQty('${escQ(item.key)}', '${catId}')">−</button>
              <div class="qty-val" id="cqty-${safeId(item.key)}">${item.qty}</div>
              <button class="qty-btn" onclick="cartChangeQty('${escQ(item.key)}', '${catId}', 1)">+</button>
            </div>
            <button class="cart-item-del" onclick="removeCartItem('${escQ(item.key)}')">✕</button>
          </div>
        </div>`;
    });
  });

  const total = cartTotal();
  const savings = cartSavings();
  const count = cartCount();

  html += `<div class="cart-summary">`;
  html += `<div class="cart-summary-row" style="font-size:15px;font-weight:700;color:var(--text)"><span>${tr('positions')}</span><span>${count} ${tr('pcs')}</span></div>`;
  if (savings > 0) {
    html += `<div class="cart-summary-row"><span>${tr('discount')}</span><span style="color:#22c55e;font-weight:700">−${savings} zł</span></div>`;
  }
  html += `<div class="cart-summary-total"><span>${tr('total')}</span><span>${formatPrice(total)}</span></div></div>`;
  html += `<div style="display:flex;gap:10px;margin-top:14px">
    <button style="flex:1;background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:14px 10px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent" ontouchstart="this.style.background='var(--surface2)'" ontouchend="this.style.background='var(--surface)'" onclick="goTo('s-cats')">${tr('add_more')}</button>
    <button style="flex:1;background:var(--accent);border:none;color:#fff;border-radius:12px;padding:14px 10px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;-webkit-tap-highlight-color:transparent" ontouchstart="this.style.opacity='.85'" ontouchend="this.style.opacity='1'" onclick="openOrder()">${tr('checkout')}</button>
  </div>`;
  html += `<div style="height:10px"></div>`;

  content.innerHTML = html;
}

function removeCartItem(key) {
  delete cart[key];
  renderCart();
  updateCartBar('s-cart');
}

function cartChangeQty(key, catId, delta) {
  // called as (key, catId) for minus, (key, catId, 1) for plus
  const d = (delta === undefined) ? -1 : 1;
  if (!cart[key]) return;
  const newQty = Math.max(0, cart[key].qty + d);
  if (newQty === 0) { removeCartItem(key); return; }
  cart[key].qty = newQty;
  renderCart();
}

function formatPolishPhone(input) {
  let v = input.value.replace(/\D/g, '');
  if (v.startsWith('48')) v = v.slice(2);
  v = v.slice(0, 9);
  let formatted = '+48 ';
  if (v.length > 0) formatted += '(' + v.slice(0, 3);
  if (v.length >= 3) formatted += ') ' + v.slice(3, 6);
  if (v.length >= 6) formatted += '-' + v.slice(6, 9);
  input.value = formatted;
}

function getDeliveryCost() {
  return cartTotal() >= 2500 ? 40 : 25;
}

function buildOrderLines() {
  // Group items by model, return formatted lines
  const byModel = {};
  Object.values(cart).forEach(i => {
    if (!byModel[i.model]) byModel[i.model] = [];
    byModel[i.model].push(i);
  });
  let lines = '';
  Object.entries(byModel).forEach(([model, items]) => {
    lines += `${model}\n`;
    items.forEach(i => { lines += `${i.flavor} x${i.qty}\n`; });
    lines += '\n';
  });
  return lines;
}

  goTo('s-success');

function saveOrderToHistory(paymentMethod, orderData) {
  const order = {
    id: Date.now(),
    date: new Date().toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }),
    paymentMethod,
    items: Object.values(cart).map(i => ({ flavor: i.flavor, model: i.model, qty: i.qty })),
    total: cartTotal(),
    delivery: getDeliveryCost(),
    grandTotal: cartTotal() + getDeliveryCost()
  };

  const storage = window.Telegram?.WebApp?.CloudStorage;
  if (storage) {
    storage.getItem('orders', (err, val) => {
      const orders = val ? JSON.parse(val) : [];
      orders.unshift(order);
      storage.setItem('orders', JSON.stringify(orders.slice(0, 20)));
    });
  } else {
    try {
      const orders = JSON.parse(localStorage.getItem('vl_orders') || '[]');
      orders.unshift(order);
      localStorage.setItem('vl_orders', JSON.stringify(orders.slice(0, 20)));
    } catch(e) {}
  }
}

function openHistory() {
  const storage = window.Telegram?.WebApp?.CloudStorage;
  if (storage) {
    storage.getItem('orders', (err, val) => {
      renderHistory(val ? JSON.parse(val) : []);
    });
  } else {
    try {
      const orders = JSON.parse(localStorage.getItem('vl_orders') || '[]');
      renderHistory(orders);
    } catch(e) { renderHistory([]); }
  }
  goTo('s-history');
}

function renderHistory(orders) {
  const content = document.getElementById('history-content');
  if (!orders || orders.length === 0) {
    content.innerHTML = `
      <div class="history-empty">
        <div class="history-empty-icon">📋</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">${tr('no_orders')}</div>
        <div style="font-size:13px">${tr('no_orders_sub')}</div>
      </div>`;
    return;
  }

  content.innerHTML = orders.map((order, idx) => {
    const byModel = {};
    order.items.forEach(i => {
      if (!byModel[i.model]) byModel[i.model] = [];
      byModel[i.model].push(`${i.flavor} ×${i.qty}`);
    });
    const itemsText = Object.entries(byModel)
      .map(([model, flavors]) => `<b>${model}:</b> ${flavors.join(', ')}`)
      .join('<br>');
    const payIcon = order.paymentMethod === 'crypto' ? '₿' : '📦';
    const payLabel = order.paymentMethod === 'crypto' ? tr('pay_label_crypto') : tr('pay_label_cod');

    return `<div class="history-card">
      <div class="history-card-header">
        <span class="history-order-num">${tr('order_num')} #${orders.length - idx}</span>
        <span class="history-date">${order.date}</span>
      </div>
      <div class="history-items">${itemsText}</div>
      <div class="history-footer">
        <span class="history-payment">${payIcon} ${payLabel}</span>
        <span class="history-total">${order.grandTotal} zł</span>
      </div>
    </div>`;
  }).join('');
}

    cat.models.forEach(m => {
      html += `
        <div class="model-card" onclick="openModelFromAll('${cat.id}','${m.id}')">
          <div class="model-thumb">
            ${m.img ? `<img src="${m.img}" alt="${m.name}">` : cat.icon}
          </div>
          <div class="model-info">
            <div class="model-name">${m.name}</div>
            <div class="model-count">${m.flavors.length} ${tr('flavor_label', m.flavors.length)}</div>
          </div>
          <div class="arrow">›</div>
        </div>`;
    });
  });
  list.innerHTML = html;
}

function openModelFromAll(catId, modelId) {
  currentCat = catalog.find(c => c.id === catId);
  currentModel = currentCat.models.find(m => m.id === modelId);
  document.getElementById('flavors-title').textContent = currentModel.name;
  document.getElementById('flavors-sub').textContent = currentCat.name;
  document.getElementById('flavor-back-btn').onclick = () => goTo('s-cats');
  renderFlavors();
  goTo('s-flavors');
}
</script>
</body>
</html>
